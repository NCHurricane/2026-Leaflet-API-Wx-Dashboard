<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Water Monitoring | NCHurricane</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/frontend/core/core.css?v=20260719a">
    <link rel="stylesheet" href="/frontend/pages/water/water.css?v=20260719a">
</head>
<body>
    <header class="core-header">
        <nav id="product-nav" class="core-product-nav" aria-label="Weather products"></nav>
        <div class="core-reliability" aria-label="Water data status">
            <span>Updated <strong id="water-updated">—</strong></span>
            <span>Age <strong id="water-age">—</strong></span>
            <span>Provider <strong id="water-provider">—</strong></span>
            <span>Source <strong id="water-source">—</strong></span>
        </div>
    </header>
    <main class="core-map-shell">
        <aside id="water-sidebar-tabs" class="core-sidebar">
            <div class="core-sidebar-pinned-head">
                <h1>Water Monitoring</h1>
                <p>NOAA river, coastal, and marine observations</p>
            </div>
            <div class="core-sidebar-tablist" role="tablist" aria-label="Water controls">
                <button type="button" data-sidebar-tab="data" role="tab">Data</button>
                <button type="button" data-sidebar-tab="overlays" role="tab">Overlays</button>
                <button type="button" data-sidebar-tab="style" role="tab">Style</button>
            </div>
            <div class="core-sidebar-scroll">
                <section data-sidebar-panel="data">
                    <div id="wx-section-water" class="wx-block" data-type="water">
                        <label id="weather-water-network-filters-title" class="label-small">Networks</label>
                        <div id="weather-water-network-filters">
                            <label class="weather-water-network-filter"><input type="checkbox" value="river" checked> River</label>
                            <label class="weather-water-network-filter"><input type="checkbox" value="coastal" checked> Coastal</label>
                            <label class="weather-water-network-filter"><input type="checkbox" value="buoy" checked> NDBC Buoys</label>
                        </div>
                        <div id="weather-water-flood-filter-row">
                            <label class="label-small">Minimum flood stage</label>
                            <div id="weather-water-flood-filters" class="wx-water-flood-pills">
                                <button type="button" class="wx-water-flood-pill" aria-selected="true" data-flood="all">All</button>
                                <button type="button" class="wx-water-flood-pill" aria-selected="false" data-flood="action">Action+</button>
                                <button type="button" class="wx-water-flood-pill" aria-selected="false" data-flood="minor">Minor+</button>
                                <button type="button" class="wx-water-flood-pill" aria-selected="false" data-flood="moderate">Moderate+</button>
                                <button type="button" class="wx-water-flood-pill" aria-selected="false" data-flood="major">Major</button>
                            </div>
                        </div>
                        <div id="weather-water-detail" class="wx-water-detail" hidden></div>
                    </div>
                </section>
                <section data-sidebar-panel="overlays" hidden>
                    <label class="wx-check-row"><span>Lat/Lon Grid</span><input type="checkbox" data-map-overlay="graticule"></label>
                    <label class="wx-check-row"><span>State Borders</span><input type="checkbox" data-map-overlay="states" checked></label>
                    <label class="wx-check-row"><span>Country Borders</span><input type="checkbox" data-map-overlay="countries" checked></label>
                    <label class="wx-check-row"><span>County Borders</span><input type="checkbox" data-map-overlay="counties"></label>
                </section>
                <section data-sidebar-panel="style" hidden>
                    <label for="water-basemap">Basemap</label>
                    <select id="water-basemap" class="wx-sidebar-select">
                        <option>Dark (No Labels)</option><option>Dark</option><option>Light</option><option>Street</option>
                    </select>
                </section>
            </div>
            <footer class="core-sidebar-footer">
                <div id="weather-water-status" role="status" aria-live="polite">Ready.</div>
                <div class="wx-radar-action-row">
                    <button id="weather-refresh-water" type="button">Refresh</button>
                    <button id="weather-clear-water" type="button">Clear</button>
                </div>
            </footer>
        </aside>
        <section class="core-map-panel">
            <div id="weather-map" class="core-map"></div>
            <time id="global-timestamp" class="core-map-timestamp"></time>
            <div id="weather-colorbar" class="core-map-legend"></div>
        </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/frontend/pages/water/water-app.js?v=20260719a"></script>
</body>
</html>
