<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tropical — NCHurricane Dashboard</title>
    <link rel="icon" href="/img/favicon.ico">
    <link rel="stylesheet" href="/frontend/lib/leaflet/leaflet.css?v=1.9.4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/frontend/core/core.css?v=20260730b">
    <link rel="stylesheet" href="/frontend/pages/tropical/tropical.css?v=20260731a">
</head>
<body>
    <header class="core-header"><div class="core-brand">NCHURRICANE</div><nav id="product-nav" class="core-nav" aria-label="Weather products"></nav></header>
    <main class="tropical-app">
        <aside id="tropical-sidebar-tabs" class="core-sidebar tropical-controls">
            <h1 class="core-visually-hidden">Tropical Weather</h1>
            <div class="core-sidebar-header">
                <div class="core-card"><dl class="core-status-grid">
                    <dt>Valid</dt><dd id="tropical-updated">—</dd><dt>Data Age</dt><dd id="tropical-age">—</dd>
                    <dt>Provider</dt><dd id="tropical-provider">—</dd>
                </dl></div>
            </div>
            <div class="core-sidebar-tabs" role="tablist" aria-label="Tropical controls">
                <button class="core-sidebar-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="tropical-panel-live" data-sidebar-tab="live"><i class="fas fa-hurricane"></i><span class="core-sidebar-tab-label">Live</span></button>
                <button class="core-sidebar-tab" type="button" role="tab" aria-selected="false" aria-controls="tropical-panel-archive" tabindex="-1" data-sidebar-tab="archive"><i class="fas fa-clock-rotate-left"></i><span class="core-sidebar-tab-label">Archive</span></button>
                <button class="core-sidebar-tab" type="button" role="tab" aria-selected="false" aria-controls="tropical-panel-settings" tabindex="-1" data-sidebar-tab="settings"><i class="fas fa-sliders"></i><span class="core-sidebar-tab-label">Settings</span></button>
            </div>
            <div class="core-sidebar-content">
                <section id="tropical-panel-live" class="core-sidebar-panel" role="tabpanel" data-sidebar-panel="live">
                    <div id="wx-section-tropical" data-tropical-mode="overview">
                        <div id="weather-tropical-opts">
                            <div class="wx-live-basin-filter">
                                <div class="wx-live-basin-label">Regions</div>
                                <div class="wx-live-basin-pills" role="group" aria-label="Live tropical regions">
                                    <button type="button" data-live-basin="WORLD" aria-pressed="true">World</button>
                                    <button type="button" data-live-basin="AL" aria-pressed="false">ATL</button>
                                    <button type="button" data-live-basin="EP" aria-pressed="false">E PAC</button>
                                    <button type="button" data-live-basin="CP" aria-pressed="false">C PAC</button>
                                </div>
                            </div>
                            <div id="weather-tropical-hub">
                                <section id="wx-tropical-panel-active" class="wx-tropical-panel wx-live-accordion" data-open="true">
                                    <button class="wx-live-accordion-header" type="button" data-live-accordion aria-expanded="true"><span>Active Systems</span><span class="wx-live-accordion-meta"><span id="weather-tropical-system-count" class="wx-tropical-count">0</span><i class="fas fa-chevron-down" aria-hidden="true"></i></span></button>
                                    <div class="wx-live-accordion-body"><div id="weather-tropical-system-cards" class="wx-tropical-card-list"></div></div>
                                </section>
                                <section id="wx-tropical-panel-outlooks" class="wx-tropical-panel wx-live-accordion" data-open="true">
                                    <button class="wx-live-accordion-header" type="button" data-live-accordion aria-expanded="true"><span>Tropical Outlooks</span><span class="wx-live-accordion-meta"><span id="weather-tropical-outlook-count" class="wx-tropical-count">0</span><i class="fas fa-chevron-down" aria-hidden="true"></i></span></button>
                                    <div class="wx-live-accordion-body"><div id="weather-tropical-outlook-cards" class="wx-tropical-card-list"></div></div>
                                </section>
                            </div>
                            <label for="weather-tropical-system" class="tropical-native-control">System</label><select id="weather-tropical-system" class="tropical-native-control" aria-hidden="true" tabindex="-1"><option value="">Select a system</option></select>
                        </div>
                    </div>
                </section>
                <section id="tropical-panel-archive" class="core-sidebar-panel" role="tabpanel" data-sidebar-panel="archive" hidden>
                    <div class="wx-archive-controls"><div class="wx-archive-field"><label for="wx-archive-basin">Basin</label><select id="wx-archive-basin"><option value="AL">Atlantic</option></select></div><div class="wx-archive-field"><label for="wx-archive-season">Season</label><select id="wx-archive-season"></select></div></div>
                    <div id="wx-archive-card-list" class="wx-tropical-card-list"></div><div id="wx-archive-status" class="wx-archive-status">Select a basin and season to browse past storms.</div><div id="wx-archive-warm-status" class="wx-archive-warm-status" role="status" aria-live="polite" hidden></div>
                </section>
                <section id="tropical-panel-settings" class="core-sidebar-panel core-settings-panel" role="tabpanel" data-sidebar-panel="settings" hidden>
                    <div class="core-field"><label for="tropical-basemap">Basemap</label><select id="tropical-basemap">Dark<option>Dark</option><option>Light</option><option>Hydro</option><option>Voyager</option><option>USGS</option><option>USGSTopo</option><option>Satellite</option></select></div>
                    <div class="core-settings-section">
                    <h2>Cities</h2>
                    <div class="core-segmented" role="radiogroup" aria-label="Cities">
                        <label><input name="tropical-cities-source" type="radio" value="off" checked><span>Off</span></label>
                        <label><input name="tropical-cities-source" type="radio" value="us"><span>US</span></label>
                        <label><input name="tropical-cities-source" type="radio" value="world"><span>World</span></label>
                    </div>
                    <div class="core-adjustment" data-city-adjustment>
                        <label id="tropical-city-density-label" for="tropical-city-density">City Density</label>
                        <input id="tropical-city-density" type="range" min="0.01" max="1" step="0.005" value="0.25">
                    </div>
                    <div class="core-adjustment" data-city-adjustment>
                        <label id="tropical-city-font-size-label" for="tropical-city-font-size">City Font Size (0.6)</label>
                        <input id="tropical-city-font-size" type="range" min="0.4" max="1.2" step="0.05" value="0.6">
                    </div>
                    </div>
                    <div class="core-settings-section"><h2>Map Overlays</h2><div class="tropical-checks core-check-list"><label class="core-check-row"><span>Lat/Lon Grid</span><input id="weather-tropical-graticule" type="checkbox"></label><label class="core-check-row"><span>State Borders</span><input data-map-overlay="states" type="checkbox"></label><label class="core-check-row"><span>Country Borders</span><input data-map-overlay="countries" type="checkbox" checked></label><label class="core-check-row"><span>County Borders</span><input data-map-overlay="counties" type="checkbox"></label></div></div>
                </section>
            </div>
            <div class="core-sidebar-footer"><div id="weather-tropical-status" class="core-message" aria-live="polite"></div><button id="weather-refresh-tropical" type="button">Refresh</button></div>
        </aside>
        <section id="weather-map-wrap" class="core-map-panel weather-map-wrap"><div id="weather-map"></div><div id="global-timestamp" class="core-global-timestamp">Last Updated: —</div><div id="weather-colorbar" class="tropical-legend" data-legend-align="left" hidden></div><button id="tropical-system-open" class="tropical-system-open" type="button" hidden><i class="fas fa-circle-info" aria-hidden="true"></i><span>System</span></button>
            <div id="wx-tropical-adv-scrubber" hidden><div id="adv-scrub-mode" class="adv-scrub-mode" hidden><button type="button" data-scrub-mode="advisory">Advisory</button><button type="button" data-scrub-mode="besttrack">Best Track</button></div><button id="adv-scrub-first" type="button">⏮</button><button id="adv-scrub-prev" type="button">◀</button><button id="adv-scrub-play" type="button" aria-pressed="false">▶</button><button id="adv-scrub-next" type="button">▶</button><button id="adv-scrub-last" type="button">⏭</button><div class="adv-scrub-speed"><button id="adv-scrub-speed-down" type="button">−</button><span id="adv-scrub-speed-label">1x</span><button id="adv-scrub-speed-up" type="button">+</button></div><input id="adv-scrub-slider" type="range" min="0" max="0" value="0"><span id="adv-scrub-label">--</span></div>
        </section>
        <aside id="tropical-system-inspector" class="tropical-system-rail" aria-label="Selected tropical system" hidden>
            <div class="tropical-system-rail-header"><h2>System</h2><button id="tropical-system-close" type="button" aria-label="Close system details" title="Close system details"><i class="fas fa-xmark" aria-hidden="true"></i></button></div>
            <div class="tropical-system-rail-body">
                <div id="weather-tropical-inspector">
                    <section id="wx-tropical-inspector-summary" class="wx-tropical-inspector-section wx-accordion" data-open="true"><button type="button" class="wx-accordion-header"><span>Summary</span><span>▾</span></button><div class="wx-accordion-body"><div id="wx-tropical-summary-head" class="wx-tropical-summary-head"></div><div id="weather-tropical-summary" class="wx-tropical-summary"></div></div></section>
                    <section id="wx-tropical-inspector-layers-panel" class="wx-tropical-inspector-section wx-accordion" data-open="true"><button type="button" class="wx-accordion-header" aria-expanded="true"><span>Storm Layers</span><span>▾</span></button><div class="wx-accordion-body"><div id="wx-tropical-inspector-layers"><div class="wx-tropical-layer-toggles">
                        <label class="wx-tc-pill"><input type="checkbox" data-tc-layer="cone"><span>Cone</span></label><label class="wx-tc-pill"><input type="checkbox" data-tc-layer="forecast_track"><span>Track</span></label><label class="wx-tc-pill"><input type="checkbox" data-tc-layer="forecast_points"><span>Points</span></label><label class="wx-tc-pill"><input type="checkbox" data-tc-layer="wind_radii"><span>Wind radii</span></label><label class="wx-tc-pill"><input type="checkbox" data-tc-layer="initial_wind_extent"><span>Initial wind extent</span></label><label class="wx-tc-pill"><input type="checkbox" data-tc-layer="watches_warnings"><span>Watch/warn</span></label><label class="wx-tc-pill"><input type="checkbox" data-tc-layer="storm_surge"><span>Surge WW</span></label><label class="wx-tc-pill"><input type="checkbox" data-tc-layer="peak_surge"><span>Peak surge</span></label><label class="wx-tc-pill"><input type="checkbox" data-tc-layer="best_track"><span>Best track</span></label>
                    </div></div></div></section>
                    <section id="wx-tropical-inspector-forecast" class="wx-tropical-inspector-section wx-accordion" data-open="false"><button type="button" class="wx-accordion-header"><span>Forecast</span><span>▾</span></button><div class="wx-accordion-body"><div id="weather-tropical-track"></div></div></section>
                    <section id="wx-tropical-inspector-products" class="wx-tropical-inspector-section wx-accordion" data-open="false"><button type="button" class="wx-accordion-header"><span>Products</span><span>▾</span></button><div class="wx-accordion-body"><div id="weather-tropical-products" class="wx-tropical-product-list"></div></div></section>
                    <section id="wx-tropical-inspector-graphics" class="wx-tropical-inspector-section wx-accordion" data-open="false"><button type="button" class="wx-accordion-header"><span>Graphics</span><span>▾</span></button><div class="wx-accordion-body"><div id="weather-tropical-graphics" class="wx-tropical-graphics-list"></div></div></section>
                    <section id="wx-tropical-inspector-floater" class="wx-tropical-inspector-section wx-accordion" data-open="false" hidden><button type="button" class="wx-accordion-header"><span>Satellite Floater</span><span>▾</span></button><div class="wx-accordion-body"><div id="wx-floater-pills" class="wx-floater-pills"><button type="button" class="wx-floater-pill" data-floater-product="GEOCOLOR">GeoColor</button><button type="button" class="wx-floater-pill" data-floater-product="13">Clean IR</button><button type="button" class="wx-floater-pill" data-floater-product="02">Red Visible</button></div></div></section>
                </div>
            </div>
        </aside>
    </main>
    <script src="/frontend/lib/leaflet/leaflet.js?v=1.9.4"></script>
    <script src="/frontend/pages/tropical/tropical-engine.js?v=20260731a"></script>
    <script src="/frontend/pages/tropical/tropical-controller.js?v=20260731d"></script>
    <script type="module" src="/frontend/pages/tropical/tropical-app.js?v=20260731b"></script>
</body>
</html>
