<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radar — NCHurricane Dashboard</title>
    <link rel="icon" href="/img/favicon.ico">
    <link rel="stylesheet" href="/frontend/lib/leaflet/leaflet.css?v=1.9.4-cleanup-20260808">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/frontend/core/core.css?v=20260730b">
    <link rel="stylesheet" href="/frontend/pages/radar/radar.css?v=20260720a">
</head>
<body>
    <header class="core-header">
        <div class="core-brand">NCHURRICANE</div>
        <nav id="product-nav" class="core-nav" aria-label="Weather products"></nav>
    </header>

    <main class="radar-app">
        <aside id="radar-sidebar-tabs" class="core-sidebar radar-controls">
            <h1 class="core-visually-hidden">Live Radar</h1>

            <div class="core-sidebar-header">
                <div class="core-card radar-status-card">
                    <div class="radar-status-title">Data status</div>
                    <dl class="core-status-grid">
                        <dt>Valid</dt><dd id="radar-updated">—</dd>
                        <dt>Data Age</dt><dd id="radar-age">—</dd>
                        <dt>Provider</dt><dd id="radar-provider">—</dd>
                    </dl>
                </div>
                <div class="core-field">
                    <label for="radar-region">Region</label>
                    <select id="radar-region"></select>
                </div>
            </div>

            <div class="core-sidebar-tabs" role="tablist" aria-label="Radar controls">
                <button id="radar-tab-live" class="core-sidebar-tab is-active" type="button"
                    role="tab" aria-selected="true" aria-controls="radar-panel-live" data-sidebar-tab="live">
                    <i class="fas fa-tower-broadcast" aria-hidden="true"></i><span class="core-sidebar-tab-label">Live</span>
                </button>
                <button id="radar-tab-settings" class="core-sidebar-tab" type="button"
                    role="tab" aria-selected="false" aria-controls="radar-panel-settings" tabindex="-1"
                    data-sidebar-tab="settings">
                    <i class="fas fa-sliders" aria-hidden="true"></i><span class="core-sidebar-tab-label">Settings</span>
                </button>
                <button id="radar-tab-archive" class="core-sidebar-tab" type="button"
                    role="tab" aria-selected="false" aria-controls="radar-panel-archive" tabindex="-1"
                    data-sidebar-tab="archive">
                    <i class="fas fa-clock-rotate-left" aria-hidden="true"></i><span class="core-sidebar-tab-label">Archive</span>
                </button>
            </div>

            <div class="core-sidebar-content">
                <section id="radar-panel-live" class="core-sidebar-panel radar-panel-stack"
                    role="tabpanel" aria-labelledby="radar-tab-live" data-sidebar-panel="live">
                    <div class="core-field">
                        <label for="radar-site">Radar Site</label>
                        <select id="radar-site"><option value="">— Select Radar Site —</option></select>
                    </div>
                    <div id="radar-product-options" class="radar-product-options" hidden>
                        <div class="radar-field-label">Level</div>
                        <div id="radar-levels" class="radar-level-pills" role="group" aria-label="Radar product level">
                            <button class="is-active" type="button" data-radar-level="Level 2" aria-pressed="true">Level 2</button>
                            <button type="button" data-radar-level="Level 3" aria-pressed="false">Level 3</button>
                        </div>
                        <div class="core-field">
                            <label for="radar-product">Product</label>
                            <select id="radar-product" disabled>
                                <option value="">Loading radar products…</option>
                            </select>
                        </div>
                    </div>
                    <label class="radar-check"><span>Show Radar Sites</span><input id="radar-show-sites" type="checkbox" checked></label>
                    <div id="radar-elevation-wrap" hidden>
                        <div class="radar-field-label">Elevation</div>
                        <div id="radar-elevation-pills" class="radar-elevation-pills"
                            role="radiogroup" aria-label="Radar elevation angle"></div>
                        <select id="radar-elevation" class="radar-native-control" aria-hidden="true" tabindex="-1">
                            <option value=""></option>
                        </select>
                    </div>
                    <div class="radar-site-tools radar-site-option" hidden>
                        <div class="radar-field-label">Site Tools</div>
                        <label class="radar-check"><span>Storm Tracks (NST)</span><input id="radar-show-storm-tracks" type="checkbox"></label>
                        <label class="radar-check"><span>Value Inspector</span><input id="radar-inspector" type="checkbox"></label>
                    </div>
                    <div class="radar-lookback">
                        <div class="radar-lookback-header">
                            <span>Lookback</span><span id="radar-lookback-value">1H</span>
                        </div>
                        <input id="radar-lookback" type="range" min="0.5" max="12" step="0.5" value="1">
                        <div class="radar-lookback-labels"><span>30M</span><span>12H</span></div>
                    </div>
                    <label class="radar-check radar-auto-update-row">
                        <span>Auto-Update</span><input id="radar-auto-update" type="checkbox" checked>
                    </label>
                </section>

                <section id="radar-panel-settings" class="core-sidebar-panel core-settings-panel radar-panel-stack"
                    role="tabpanel" aria-labelledby="radar-tab-settings" data-sidebar-panel="settings" hidden>
                    <div class="core-field">
                        <label for="radar-basemap">Basemap</label>
                        <select id="radar-basemap">
                            Dark<option>Dark</option><option>Light</option><option>Hydro</option>
                            <option>Voyager</option><option>USGS</option><option>USGSTopo</option><option>Satellite</option>
                        </select>
                    </div>
                    <div class="core-adjustment">
                        <label id="radar-opacity-label" for="radar-opacity">Radar Opacity (0.9)</label>
                        <input id="radar-opacity" type="range" min="0.1" max="1" step="0.05" value="0.9">
                    </div>
                    <div class="core-settings-section">
                        <h2>Cities</h2>
                        <div class="core-segmented" role="radiogroup" aria-label="Cities">
                            <label><input name="radar-cities-source" type="radio" value="off" checked><span>Off</span></label>
                            <label><input name="radar-cities-source" type="radio" value="us"><span>US</span></label>
                            <label><input name="radar-cities-source" type="radio" value="world"><span>World</span></label>
                        </div>
                        <div class="core-adjustment" data-city-adjustment>
                            <label for="radar-city-density">City Density</label>
                            <input id="radar-city-density" type="range" min="0.01" max="1" step="0.005" value="0.25">
                        </div>
                        <div class="core-adjustment" data-city-adjustment>
                            <label id="radar-city-font-size-label" for="radar-city-font-size">City Font Size (0.6)</label>
                            <input id="radar-city-font-size" type="range" min="0.4" max="1.2" step="0.05" value="0.6">
                        </div>
                    </div>
                    <div class="core-settings-section">
                        <h2>Map Overlays</h2>
                        <div class="radar-check-list core-check-list">
                            <label class="radar-check core-check-row"><span>Lat/Lon Grid</span><input data-map-overlay="graticule" type="checkbox"></label>
                            <label class="radar-check core-check-row"><span>State Borders</span><input data-map-overlay="states" type="checkbox" checked></label>
                            <label class="radar-check core-check-row"><span>Country Borders</span><input data-map-overlay="countries" type="checkbox"></label>
                            <label class="radar-check core-check-row"><span>County Borders</span><input data-map-overlay="counties" type="checkbox"></label>
                        </div>
                    </div>
                </section>

                <section id="radar-panel-archive" class="core-sidebar-panel core-placeholder-panel"
                    role="tabpanel" aria-labelledby="radar-tab-archive" data-sidebar-panel="archive" hidden>
                    <p>Archive tools are planned for a future update.</p>
                </section>
            </div>

            <div class="core-sidebar-footer">
                <div id="radar-message" class="core-message" aria-live="polite"></div>
                <div class="radar-footer-actions">
                    <button id="radar-refresh" class="radar-refresh" type="button">Refresh</button>
                    <button id="radar-clear" type="button">Clear</button>
                </div>
            </div>
        </aside>

        <section id="radar-map-wrap" class="core-map-panel radar-map-wrap" aria-label="Live radar map">
            <div id="radar-map"></div>
            <div id="global-timestamp" class="core-global-timestamp">Last Updated: —</div>
            <div id="radar-legend" class="radar-legend" data-legend-align="left" hidden></div>
            <div id="radar-scrubber-bar" hidden><div id="radar-bottom-scrubber"></div></div>
        </section>
    </main>

    <script src="/frontend/lib/leaflet/leaflet.js?v=1.9.4"></script>
    <script type="module" src="/frontend/pages/radar/radar-page.js?v=20260729b"></script>
</body>
</html>
