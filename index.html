<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NCHurricane Dashboard 2026</title>
        <link rel="icon" href="/img/favicon.ico">
        <link rel="stylesheet" href="/css/shared.css?v=20260826a">
        <style>
            .landing-wrap {
                max-width: 1200px;
                margin: 0 auto;
            }

            .landing-subtitle {
                text-align: center;
                color: var(--subtext);
                margin-bottom: 1.5rem;
                font-weight: 700;
            }

            .card-grid {
                display: grid;
                grid-template-columns: repeat(5, minmax(180px, 1fr));
                gap: 1rem;
                margin-bottom: 1.25rem;
            }

            .tab-card {
                background: var(--secondary);
                border: 1px solid #334155;
                border-radius: 10px;
                padding: 1rem;
                text-align: center;
                text-decoration: none;
                color: var(--text);
                font-weight: 700;
                min-height: 120px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 0.4rem;
            }

            .tab-card:hover {
                border-color: var(--accent);
                background: #1b2450;
            }

            .tab-card span {
                color: var(--subtext);
                font-size: 0.8rem;
            }

            @media (max-width: 1100px) {
                .card-grid {
                    grid-template-columns: repeat(2, minmax(180px, 1fr));
                }
            }
        </style>
    </head>

    <body>
        <div class="landing-wrap">
            <header>
                <h1 class="landing-brand">
                    <a href="/" aria-label="Chuck Copeland Weather home">
                        <img src="/img/chuck-copeland-weather-logo.svg?v=20260826a" alt="">
                    </a>
                </h1>
                <p class="landing-subtitle">Select a page to open a fully isolated workflow.</p>
            </header>

            <main class="card-grid">
                <a class="tab-card" href="/workspace" style="border-color:var(--accent);background:#1b2450;">Weather
                    <span>Main Dashboard</span></a>
            </main>

        </div>
    </body>

</html>
